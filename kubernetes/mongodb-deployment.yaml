apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: bitnami/mongodb:4.4
        ports:
        - containerPort: 27017
        env:
        - name: MONGODB_REPLICA_SET_MODE
          value: "primary"
        - name: MONGODB_REPLICA_SET_NAME
          value: "rs0"
        - name: MONGODB_PORT_NUMBER
          value: "27017"
        - name: MONGODB_INITIAL_PRIMARY_HOST
          value: "mongodb"
        - name: MONGODB_INITIAL_PRIMARY_PORT_NUMBER
          value: "27017"
        - name: MONGODB_ADVERTISED_HOSTNAME
          value: "mongodb"
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        volumeMounts:
        - name: mongodb-data
          mountPath: /bitnami/mongodb
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: mongodb-pvc