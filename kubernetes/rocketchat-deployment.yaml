apiVersion: apps/v1
kind: Deployment
metadata:
  name: rocketchat
spec:
  replicas: 5
  selector:
    matchLabels:
      app: rocketchat
  template:
    metadata:
      labels:
        app: rocketchat
    spec:
      containers:
      - name: rocketchat
        image: registry.rocket.chat/rocketchat/rocket.chat:5.4.5
        ports:
        - containerPort: 3006
        env:
        - name: MONGO_URL
          value: "mongodb://mongodb:27017/rocketchat?replicaSet=rs0"
        - name: MONGO_OPLOG_URL
          value: "mongodb://mongodb:27017/local?replicaSet=rs0"
        - name: ROOT_URL
          value: "http://localhost:3006"
        - name: PORT
          value: "3006"
        - name: DEPLOY_METHOD
          value: "kubernetes"
        - name: DEPLOY_PLATFORM
          value: "kubernetes"